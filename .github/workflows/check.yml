name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install maintenance tools
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          npm ci
      - name: Check documentation, Python and JavaScript
        run: python -X utf8 scripts/check_maintenance.py
      - name: Test maintenance checks
        run: python -X utf8 -m unittest discover -s scripts/tests -v
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run local conversion tests
        run: python tests/run_tests.py --work-dir work/test-tmp
      - name: Package extension
        run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: extension-packages
          path: dist/*
